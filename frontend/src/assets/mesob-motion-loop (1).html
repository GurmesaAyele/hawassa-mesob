<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#304ea6">
<title>Hawassa Mesob — Motion Loop</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#304ea6;color:#fff;font-family:system-ui,sans-serif}

/* one living background shared by all three scenes: the light follows each scene's focal point */
#show{position:fixed;inset:0;overflow:hidden;--bx:50%;--by:46%;--bc:rgb(58,92,194);
  background:#304ea6 radial-gradient(ellipse at var(--bx) var(--by),var(--bc) 0%,#304ea6 52%,#2a4496 100%)}

/* each scene lives in its own isolated frame, so its layout / media queries behave exactly as authored */
.layer{position:absolute;inset:0;overflow:hidden;visibility:hidden;pointer-events:none;z-index:0}
.layer.on{visibility:visible;z-index:1}
.layer.top{z-index:2}
.layer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;pointer-events:none}

/* transition effects */
#fxl{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
#fxl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#rA,#rG,#rB{fill:none;opacity:0}
#glow{position:absolute;left:0;top:0;border-radius:50%;opacity:0;
  background:radial-gradient(closest-side,rgba(255,238,178,.95),rgba(255,211,94,.34) 46%,rgba(255,211,94,0) 72%)}
#edge{position:absolute;left:0;top:0;width:100%;height:3px;margin-top:-1.5px;opacity:0;
  background:linear-gradient(90deg,transparent,#ffd35e 12%,#fff 50%,#ffd35e 88%,transparent);
  box-shadow:0 0 22px 5px rgba(255,211,94,.55)}
#edge::after{content:"";position:absolute;left:0;right:0;top:100%;height:28vh;
  background:linear-gradient(180deg,rgba(255,226,140,.28),rgba(255,226,140,0))}
.sp{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ffe08a;
  box-shadow:0 0 10px 2px rgba(255,211,94,.8);opacity:0}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* reduced motion: slow cross-fades between the static end-states; the services grid stays scrollable */
.rm .layer.on iframe{pointer-events:auto}
</style>
</head>
<body>
<main id="show" aria-label="Hawassa Mesob">
  <h1 class="sr">Hawassa Mesob — One Stop Service Center</h1>
  <p class="sr">MESOB: Modern. Ethiopian. Service for. Organised. Benefits. A unified one-stop public service delivery platform launched by the Ethiopian government. Efficiency, Security, Accessibility.</p>
  <ul class="sr" id="srlist"></ul>

  <div class="layer" id="L1"><iframe id="F1" title="Hawassa Mesob logo" aria-hidden="true" tabindex="-1"></iframe></div>
  <div class="layer" id="L2"><iframe id="F2" title="Mesob services" aria-hidden="true" tabindex="-1"></iframe></div>
  <div class="layer" id="L3"><iframe id="F3" title="What is MESOB" aria-hidden="true" tabindex="-1"></iframe></div>

  <div id="fxl" aria-hidden="true">
    <div id="glow"></div>
    <svg focusable="false">
      <circle id="rG" stroke="#ffd35e" stroke-width="20"/>
      <circle id="rA" stroke="#ffe9a8" stroke-width="3"/>
      <circle id="rB" stroke="#ffffff" stroke-width="1.5"/>
    </svg>
    <div id="edge"></div>
    <div id="sparks"></div>
  </div>
</main>

<script type="text/plain" id="scene1"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#304ea6">
<title>Hawassa Mesob — Logo Motion</title>
<style>
@font-face{font-family:'BSC';font-weight:800;font-style:normal;font-display:swap;src:url(@@BSC@@) format('woff2')}
html,body{margin:0;height:100%;overflow:hidden;background:#304ea6}
body{display:grid;place-items:center;font-family:'Poppins',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 46%,#3a5cc2 0%,#304ea6 52%,#2a4496 100%)}
#wrap{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:min(4vmin,52px);width:100%;max-height:100vh}
#stage{width:min(70vmin,46vw,720px);aspect-ratio:1;flex:none}
#word{position:relative;text-align:left;font-size:min(10.4vmin,5.5vw,96px);color:#fff;perspective:800px;flex:none}
#wpar{position:relative}
.wstreak{position:absolute;left:-25%;right:-25%;top:46%;height:2px;background:linear-gradient(90deg,transparent,#7fe3ff,#fff,#7fe3ff,transparent);opacity:0;box-shadow:0 0 18px #7fe3ff}
.wglow{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,255,255,.14),rgba(249,188,47,.10) 45%,transparent 70%);pointer-events:none;z-index:-1}
.wstreak,.wglow{display:none!important}
#hring{position:fixed;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border:.8vmin solid #f5b913;border-radius:50%;opacity:0;pointer-events:none}
.l1,.l2{white-space:nowrap}
.l1{font-family:'BSC','Barlow Semi Condensed','Arial Narrow',Impact,sans-serif;font-weight:800;letter-spacing:.015em;line-height:1;white-space:nowrap;text-transform:uppercase}
.l2{font-weight:500;font-size:.28em;display:flex;justify-content:space-between;margin-top:.6em}
.ch,.sp{display:inline-block}
.w{display:inline-block;white-space:nowrap}
.ch{color:transparent;-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;background-size:300% 100%;background-position:100% 0;background-image:linear-gradient(100deg,#fff 0 42%,#ffe08a 50%,#fff 58% 100%)}
.l2 .ch{background-image:linear-gradient(100deg,#fff 0 42%,#ffd35e 50%,#fff 58% 100%)}
.sp{width:.28em}
.rule{display:none;align-items:center;gap:14px;width:100%;margin:.55em 0 .5em}
.rule i{flex:1;height:1.5px;background:linear-gradient(90deg,transparent,#f5b913)}
.rule i+b+i{background:linear-gradient(270deg,transparent,#f5b913)}
.rule b{width:9px;height:9px;transform:rotate(45deg);background:#f5b913;box-shadow:0 0 12px #f5b913}
svg{width:100%;height:100%;display:block;overflow:visible}
#mesob,#word{visibility:hidden}
.ready #mesob,.ready #word{visibility:visible}
.rip{vector-effect:non-scaling-stroke}
#replay{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:9px 20px;font:500 13px 'Poppins',system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(6px);transition:.2s}
#replay:hover{background:rgba(245,185,19,.16);border-color:#f5b913;color:#fff}
#skip{position:fixed;bottom:22px;right:22px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:9px 16px;font:500 13px 'Poppins',system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(6px);transition:opacity .3s,background .2s}
#skip:hover{background:rgba(245,185,19,.16);border-color:#f5b913}
.done #skip{opacity:0;pointer-events:none}
@media (max-width:700px){#wrap{gap:2.5vw;padding:0 4vw;box-sizing:border-box}#stage{width:34vw}#word{font-size:7.4vw}.l2{font-size:.34em}}
@media (max-width:700px) and (orientation:portrait){#wrap{flex-direction:row;align-items:center;justify-content:center;gap:2.5vw;padding:0 4vw;box-sizing:border-box;width:100%}#stage{width:min(29vw,20vh);flex:none}#word{font-size:min(6.2vw,4.2vh);flex:none;min-width:0}.l1{white-space:nowrap}.l2{font-size:.3em}}
@font-face{font-family:'Poppins';font-weight:500;font-style:normal;font-display:swap;src:url(@@POP500@@) format('woff2')}
/* host overrides: the show owns the background and the transport controls */
html,body{background:transparent!important}#replay,#skip{display:none!important}
</style>
<noscript><style>#mesob,#word{visibility:visible}</style></noscript>

  b.layer.classList.add('on','top');a.layer.classList.add('on');
  tr=gsap.timeline({onComplete:()=>{
    stop(a);a.layer.classList.remove('on','top');b.layer.classList.remove('top');
    cleanup();tr=null;
  }});
  const {startAt}=(reduce?TR_RM:TR[from])(tr,a,b);
  tr.call(()=>{play(b);cur=to;log('scene '+(to+1)+' start');arm(to);},null,startAt);
}

function begin(i){
  tr&&tr.kill();tr=null;
  S.forEach(s=>{stop(s);s.layer.classList.remove('on','top');});
  cleanup();gsap.set(show,BG[i]);
  cur=target=i;
  prep(S[i]);
  const my=++epoch;
  frames(2,()=>{                                           /* GSAP applies the scene's first frame before it becomes visible */
    if(my!==epoch)return;
    S[i].layer.classList.add('on');play(S[i]);
    log('scene '+(i+1)+' start');
    arm(i);
  });
}

function setRunning(){
  const on=inView&&!userPaused;
  on?gsap.globalTimeline.resume():gsap.globalTimeline.pause();
  S.forEach(s=>{if(s.live&&s.api)s.api.setVis(on);});
}
if(window.IntersectionObserver)new IntersectionObserver(([e])=>{inView=e.isIntersecting;setRunning();},{threshold:.05}).observe(show);

/* a resize re-lays-out the scenes (each does it itself); restart the active one cleanly so the conductor and the scene never drift apart */
let rz,lw=innerWidth,lh=innerHeight;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(innerWidth===lw&&Math.abs(innerHeight-lh)<=120)return;
  lw=innerWidth;lh=innerHeight;if(started)begin(target);
},420);});

/* keys: Space pause/resume · → next scene · 1 2 3 jump */
addEventListener('keydown',e=>{
  if(!started)return;
  if(e.code==='Space'){userPaused=!userPaused;setRunning();e.preventDefault();}
  else if(e.key==='ArrowRight'&&!tr){holdCall&&holdCall.kill();transition(cur,nextOf(cur));}
  else if(e.key>='1'&&e.key<='3')begin(+e.key-1);
});

let started=false;
Promise.all(S.map(load)).then(()=>{
  if(reduce){$('#show').classList.add('rm');S.forEach(s=>{s.api=null;});}
  const ul=$('#srlist');
  try{(S[1].w.MESOB_SERVICES||[]).forEach(v=>{const li=document.createElement('li');li.textContent=v.name;ul.appendChild(li);});}catch(e){}
  S.forEach(s=>s.api&&s.api.setVis(false));
  started=true;
  begin(Math.max(0,Math.min(2,(+Q.get('scene')||1)-1)));
});

window.__show={S,log:LOG,begin,get cur(){return cur},get target(){return target},get tr(){return tr},holdOf,next:()=>transition(cur,nextOf(cur))};
})();

</script>
</body>
